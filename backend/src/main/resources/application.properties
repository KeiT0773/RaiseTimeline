spring.application.name=backend

# ポート（8080）は Spring Boot の既定を使う。server.port は書かない（CLAUDE.md 6.）。

# --- データベース接続設定 -------------------------------------------------
# 接続先はリポジトリ直下の compose.yaml で起動する PostgreSQL。
# ユーザー名・パスワード・DB 名は compose.yaml の environment と一致させる。
# ローカル開発専用の値のため、そのままリポジトリに含めている。
spring.datasource.url=jdbc:postgresql://localhost:5432/raisetimeline
spring.datasource.username=raisetimeline
spring.datasource.password=raisetimeline

# --- Flyway（テーブル定義の履歴管理） -------------------------------------
# 起動時に src/main/resources/db/migration の SQL（V1__..., V2__...）を連番順に適用する。
# テーブルの作成・変更は Flyway だけが行う。適用済みのファイルは編集せず、次の連番で追加する。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- MyBatis（DB アクセス） ------------------------------------------------
# SQL は src/main/resources/mapper/ 以下の XML に書き、Java 側は @Mapper のインターフェースだけを置く。
mybatis.mapper-locations=classpath:mapper/**/*.xml
# 列名 display_name をフィールド名 displayName に自動で対応づける。
mybatis.configuration.map-underscore-to-camel-case=true

# --- 認証（JWT）。auth.md 3.、API 設計書 2.2 -------------------------------
# アクセストークン（JWT）の署名に使う秘密鍵（Base64。32 バイト以上）。
# ここに書いた値はローカル開発専用。本番では環境変数 APP_AUTH_JWT_SECRET で必ず差し替える
# （Spring Boot は環境変数を同名の設定より優先する）。値が漏れると誰でもトークンを偽造できる。
app.auth.jwt-secret=0pKyWE+t/Pd5GN/X1534dA4BfzDunm6l0CGn5I1p+8cI7OspNgcIzMrTofPXNa2y
# アクセストークンとリフレッシュトークンの有効期限
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=14d
# Cookie の Secure 属性（HTTPS のときだけ送る）。ローカルは http なので false、本番は true にする
app.auth.cookie-secure=false

# --- エラー応答 ------------------------------------------------------------
# Spring 自身が投げる例外（パスの型不一致による 400 など）も、
# RFC 9457 ProblemDetail の形式で応答する。
spring.mvc.problemdetails.enabled=true
