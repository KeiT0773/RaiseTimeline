<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RaiseTimeline（モック）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 共通ヘッダー（ログイン中のみ表示。中身は app.js が描画する） -->
    <header id="site-header" class="site-header" hidden></header>

    <!-- フラッシュメッセージ（成功・失敗の通知） -->
    <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>

    <!-- 各画面（SC-01〜SC-07）の描画先 -->
    <main id="app" class="app"></main>

    <footer class="site-footer">
      <p>
        これは HTML / CSS / JavaScript だけで作った静的なモックです。データはこのブラウザの localStorage にだけ保存されます。
      </p>
      <button type="button" id="reset-data" class="btn btn-link">データをリセット</button>
    </footer>

    <!-- 画像ビューアー（モーダル） -->
    <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="画像ビューアー" hidden>
      <button type="button" class="viewer-close" aria-label="閉じる">×</button>
      <button type="button" class="viewer-nav viewer-prev" aria-label="前の画像">←</button>
      <img class="viewer-img" alt="" />
      <button type="button" class="viewer-nav viewer-next" aria-label="次の画像">→</button>
      <p class="viewer-count"></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
